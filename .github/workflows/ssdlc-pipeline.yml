name: "SSDLC Quality Gate - SAST -> SCA/SBOM -> Secretos"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  paso-1-sast:
    name: "1. SAST (CodeQL)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  paso-2-sca-sbom:
    name: "2. SCA & SBOM (Trivy)"
    runs-on: ubuntu-latest
    needs: paso-1-sast
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Resolver árbol de dependencias (package-lock.json)
        run: npm install --package-lock-only --ignore-scripts

      - name: Escanear CVEs en dependencias (SARIF para GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Subir alertas SCA a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-sca.sarif'
          category: "trivy-sca"

      - name: Generar SBOM CycloneDX (NIST SSDF PS.3)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Publicar artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-fintech-cyclonedx
          path: sbom-cyclonedx.json

      - name: Quality Gate SCA (Bloquea si hay CRITICAL o HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  paso-3-secretos:
    name: "3. Secretos (Gitleaks)"
    runs-on: ubuntu-latest
    needs: paso-2-sca-sbom
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear todo el repositorio con Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose
