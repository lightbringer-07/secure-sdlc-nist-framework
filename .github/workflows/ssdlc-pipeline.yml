name: "SSDLC Pipeline - SAST -> SCA/SBOM -> Secretos"

on:
  push:
    branches: [ "main", "feature/test-quality-gate" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  paso-1-sast:
    name: "1. SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar y ejecutar Semgrep CLI (JSON base)
        run: |
          pip install semgrep
          semgrep scan --config "p/security-audit" --json --output semgrep-results.json

      - name: Publicar tabla SAST en el Summary
        run: |
          COUNT=$(jq '.results | length' semgrep-results.json)
          echo "### 🔍 1. Resultados SAST - Análisis Estático (Semgrep)" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" -gt 0 ]; then
            echo "| Regla Detectada | Severidad | Archivo | Línea |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            jq -r '.results[] | "| **\(.check_id | split(".") | last)** | \(.extra.severity) | `\(.path)` | \(.start.line) |"' semgrep-results.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Quality Gate bloqueado:** Se detectaron $COUNT vulnerabilidades en el código fuente." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Análisis estático completado sin errores de seguridad." >> $GITHUB_STEP_SUMMARY
          fi

  paso-2-sca-sbom:
    name: "2. SCA & SBOM (Trivy)"
    runs-on: ubuntu-latest
    needs: paso-1-sast
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Resolver árbol de dependencias (package-lock.json)
        run: npm install --package-lock-only --ignore-scripts

      - name: Escaneo único SCA (JSON base)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Mostrar tabla en log y generar SARIF
        run: |
          trivy convert --format table trivy-results.json
          trivy convert --format sarif --output trivy-sca.sarif trivy-results.json

      - name: Subir alertas SCA a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-sca.sarif'
          category: "trivy-sca"

      - name: Generar SBOM CycloneDX (NIST SSDF PS.3)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Publicar artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-fintech-cyclonedx
          path: sbom-cyclonedx.json

      - name: Publicar tabla SCA en el Summary
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          echo "### 📦 2. Resultados SCA - Dependencias Vulnerables (Trivy)" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" -gt 0 ]; then
            echo "| Paquete | CVE | Severidad | Instalada | Fix Disponible |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :---: | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | "| `\(.PkgName)` | **\(.VulnerabilityID)** | \(.Severity) | `\(.InstalledVersion)` | `\(.FixedVersion // "N/A")` |"' trivy-results.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No se detectaron CVEs CRITICAL o HIGH en las dependencias." >> $GITHUB_STEP_SUMMARY
          fi

  paso-3-secretos:
    name: "3. Secretos (Gitleaks)"
    runs-on: ubuntu-latest
    needs: paso-2-sca-sbom
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con reglas nativas
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect \
            --source="/path" \
            --no-git \
            --report-format="json" \
            --report-path="/path/gitleaks-report.json" \
            --exit-code=0 \
            --verbose

      - name: Publicar tabla de Secretos en el Summary
        run: |
          COUNT=$(jq 'length' gitleaks-report.json)
          echo "### 🔑 3. Resultados Secret Scanning (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" -gt 0 ]; then
            echo "| Regla Detectada | Archivo | Línea |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "| **\(.RuleID)** | `\(.File)` | \(.StartLine) |"' gitleaks-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No se detectaron credenciales expuestas en el repositorio." >> $GITHUB_STEP_SUMMARY
          fi